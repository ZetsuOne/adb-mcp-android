[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adb-mcp-android"
version = "0.1.0"
description = "MCP bridge to an Android smartphone/emulator via ADB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ZetsuOne" },
]
keywords = [
    "mcp",
    "adb",
    "android",
    "automation",
    "cursor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/ZetsuOne/adb-mcp-android"
Repository = "https://github.com/ZetsuOne/adb-mcp-android"
Issues = "https://github.com/ZetsuOne/adb-mcp-android/issues"

[project.scripts]
adb-mcp-android = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "adb_client.py"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"adb_client.py" = "adb_client.py"

[tool.hatch.build.targets.sdist]
include = [
    "server.py",
    "adb_client.py",
    "client.py",
    "requirements.txt",
    "README.md",
    "README_RU.md",
    "LICENSE",
    "mcp.json.example",
]
